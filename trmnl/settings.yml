---
name: BurrowGate
description: "BurrowGate reverse proxy monitoring"
strategy: polling
refresh_interval: 15
polling_verb: GET
polling_url: "{% assign base = instance_url | strip %}{% assign last = base | slice: -1 %}{{ base }}{% unless last == '/' %}/{% endunless %}_burrowgate/api/v1/monitoring?view={{ view | url_encode }}&hours={{ hours | url_encode }}&siteId={{ site_id | strip | url_encode }}"
polling_headers: "authorization=Bearer {{ api_token | strip | url_encode }}"
no_screen_padding: "no"
dark_mode: "no"
custom_fields:
  - keyname: about
    field_type: author_bio
    name: BurrowGate
    category: analytics,programming
    description: Traffic, bandwidth, cache, protection, and system monitoring for your self-hosted BurrowGate reverse proxy.
    learn_more_url: https://burrowgate.org
    github_url: https://github.com/Rabbit-Company/BurrowGate
    email_address: info@rabbit-company.com
  - keyname: instance_url
    field_type: url
    optional: true
    name: BurrowGate instance URL
    placeholder: https://gate.example.com
    description: Public HTTPS base URL of your BurrowGate dashboard, without /_burrowgate/admin. TRMNL must be able to reach this address.
  - keyname: api_token
    field_type: password
    name: Read-only API token
    placeholder: "bgro_xxx"
    optional: true
    description: Create a token in BurrowGate under Account -> API tokens. Paste the bgro_ token here.
  - keyname: view
    field_type: select
    name: View
    default: overview
    options:
      - Traffic overview: overview
      - Request traffic: traffic
      - Blocked requests: blocked
      - Client bandwidth: bandwidth
      - Cache hit ratio: cache
      - Managed protection: protection
      - Request latency: latency
      - Top countries: geography
      - CPU usage: cpu
      - Memory usage: memory
      - Storage usage: disk
      - Network throughput: network
  - keyname: hours
    field_type: select
    name: Time range
    default: "24"
    options:
      - Last hour: "1"
      - Last 6 hours: "6"
      - Last 24 hours: "24"
      - Last 7 days: "168"
  - keyname: site_id
    field_type: string
    name: Site ID
    placeholder: "site_xxx"
    optional: true
    description: Optional site ID from your BurrowGate dashboard URL or the monitoring sites API. Leave empty for all sites and for CPU, memory, storage, or network views. This filters the display (the token can read all sites).
  - keyname: date_format
    field_type: select
    name: Date format
    default: iso
    options:
      - "2026-08-06 (YYYY-MM-DD)": iso
      - "06.08.2026 (DD.MM.YYYY)": day_first_dots
      - "06/08/2026 (DD/MM/YYYY)": day_first_slashes
      - "08/06/2026 (MM/DD/YYYY)": month_first_slashes
  - keyname: time_format
    field_type: select
    name: Time format
    default: twenty_four_seconds
    description: Applies to chart dates and the last update time, shown in your TRMNL device's local time zone.
    options:
      - "15:43:32 (24-hour with seconds)": twenty_four_seconds
      - "15:43 (24-hour)": twenty_four
      - "03:43:32 PM (12-hour with seconds)": twelve_seconds
      - "03:43 PM (12-hour)": twelve
